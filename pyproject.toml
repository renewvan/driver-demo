[project]
name = "driver-demo"
version = "0.3.0"
description = "Demo mode: a simulated van published under the renewvan/demo/ MQTT topic namespace"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
